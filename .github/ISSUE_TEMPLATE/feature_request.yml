name: Feature request
description: Suggest an improvement for Vetch
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement. Please describe the user problem before the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or related tools if applicable.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: The request is about Vetch rather than support for one specific website.
          required: true
